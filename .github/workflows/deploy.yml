# Push to main -> typecheck -> build v2 -> deploy to Cloudflare Pages (ci-events, production).
#
# The live site is v2 (the app in v2/). v1 at the repository root is sealed at
# tag v1.0.0 and is not built here.
#
# Cloudflare's own Git integration is deliberately NOT used: ci-events was created
# by direct upload and cannot be switched, and a new project would change the
# origin the Firebase OAuth handler is registered on (docs/auth-domain-runbook.md).
#
# Needs one repository secret:  CLOUDFLARE_API_TOKEN  (Pages:Edit on the account)
# Without it the run still builds, then prints a warning and does not deploy.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

jobs:
  web:
    name: ci-events (Cloudflare Pages)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        env:
          # Public Firebase client config — identifies the project, does not
          # authenticate. Kept as repository *variables*; see v2/.env.example.
          # The auth domain is not passed: v2/.env.production fixes it to
          # ci-events.pages.dev for every production build.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || { echo "::error::Repository variables VITE_FIREBASE_* are not set"; exit 1; }
          npm run build
          grep -lq 'ci-events\.pages\.dev' dist/assets/*.js || { echo "::error::Bundle is not built for ci-events.pages.dev — v2/.env.production is missing"; exit 1; }

      - name: Deploy to production
        if: env.HAS_CF_TOKEN == 'true'
        # From the repository root, so ./functions (the auth-handler proxy
        # sign-in depends on) is bundled with the site.
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy v2/dist --project-name=ci-events --branch=main

      - name: Not deployed
        if: env.HAS_CF_TOKEN != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set, so GitHub did not deploy this push. If it went out with 'npm run ship', live already matches main; otherwise main is ahead of https://ci-events.pages.dev"
          echo "Optional — to deploy from GitHub too:  gh secret set CLOUDFLARE_API_TOKEN -R songdo-technology/CI-Connects   (HANDOFF.md -> Automatic deploys)"
