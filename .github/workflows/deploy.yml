# Push to main -> typecheck -> build -> deploy to Cloudflare Pages (ci-events, production).
#
# Cloudflare's own Git integration is deliberately NOT used: ci-events was created
# by direct upload and cannot be switched, and a new project would change the
# origin the Firebase OAuth handler is registered on (docs/auth-domain-runbook.md).
#
# Needs one repository secret:  CLOUDFLARE_API_TOKEN  (Pages:Edit on the account)
# Without it the run still builds, then prints a warning and does not deploy.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

jobs:
  web:
    name: ci-events (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        env:
          # Public Firebase client config — identifies the project, does not
          # authenticate. Kept as repository *variables*; see .env.example.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ALLOWED_EMAIL_DOMAIN: ${{ vars.VITE_ALLOWED_EMAIL_DOMAIN }}
          VITE_USE_FIRESTORE: 'true'
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || { echo "::error::Repository variables VITE_FIREBASE_* are not set"; exit 1; }
          test "$VITE_FIREBASE_AUTH_DOMAIN" = "ci-events.pages.dev" || { echo "::error::VITE_FIREBASE_AUTH_DOMAIN must be ci-events.pages.dev (see docs/auth-domain-runbook.md)"; exit 1; }
          npm run build

      - name: Deploy to production
        if: env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=ci-events --branch=main

      - name: Not deployed
        if: env.HAS_CF_TOKEN != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set. Built OK but NOT deployed — main is ahead of https://ci-events.pages.dev"
          echo "Set it once with:  gh secret set CLOUDFLARE_API_TOKEN   (see HANDOFF.md -> Automatic deploys)"
